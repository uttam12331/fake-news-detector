name: Build Fake Call APK

on:
  push:
    branches:
      - "**"
    paths:
      - "projects/fake_call/**"
      - ".github/workflows/build-fake-call-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: projects/fake_call/android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: projects/fake_call/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-call-debug-apk
          path: projects/fake_call/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
